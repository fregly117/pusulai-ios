name: PusulAI
options:
  bundleIdPrefix: com.klennys
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PusulAI:
    type: application
    platform: iOS
    sources:
      - path: PusulAI
      - path: Shared
    dependencies:
      - target: PusulAIWidgets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klennys.pusulai
        PRODUCT_NAME: PusulAI
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    info:
      path: PusulAI/Info.plist
      properties:
        CFBundleDisplayName: PusulAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        # Dinamik Ada / kilit ekranı canlı skor (Live Activities)
        NSSupportsLiveActivities: true
        # Uygulama arka plandayken canlı skor / gol takibinin sürmesi için (sessiz ses oturumu)
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true

  PusulAIWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PusulAIWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klennys.pusulai.widgets
        PRODUCT_NAME: PusulAIWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: PusulAIWidgets/Info.plist
      properties:
        CFBundleDisplayName: PusulAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
